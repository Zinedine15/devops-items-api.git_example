services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Copy .env.example to .env and set DB_NAME}
      DB_USER: ${DB_USER:?Copy .env.example to .env and set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - items-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "port=${DB_PORT:-5432}"]
    environment:
      POSTGRES_DB: ${DB_NAME:?Copy .env.example to .env and set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Copy .env.example to .env and set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -p \"$$DB_PORT\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - items-network

networks:
  items-network:
    driver: bridge

volumes:
  postgres_data:
